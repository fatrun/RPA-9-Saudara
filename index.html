  <body class="bg-surface text-slate-800 antialiased selection:bg-cream selection:text-bordo">
    <div id="root">
      <div style="min-height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #072321; color: #FAF7F2; font-family: system-ui, -apple-system, sans-serif;">
        <div style="width: 44px; height: 44px; border: 4px solid rgba(250, 247, 242, 0.2); border-top-color: #FAF7F2; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <h2 style="font-size: 16px; font-weight: 700; letter-spacing: 0.05em; margin: 0 0 4px 0; color: #FAF7F2;">RPA 9 SAUDARA</h2>
        <p style="font-size: 12px; color: #E8DCC8; opacity: 0.85; margin: 0;">Memuat Sistem Operasional...</p>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var isLocal = Boolean(
          window.location.hostname === 'localhost' ||
          window.location.hostname === '127.0.0.1' ||
          window.location.hostname === '[::1]'
        );

        if ('serviceWorker' in navigator) {
          if (isLocal) {
            // Mode Lokal / Dev: Matikan Service Worker & bersihkan cache agar tidak mengganggu Vite
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            });
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                for (var j = 0; j < keys.length; j++) {
                  caches.delete(keys[j]);
                }
              });
            }
          } else if (window.location.protocol.startsWith('http')) {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('/sw.js').catch(function() {});
            });
          }
        }
      })();
    </script>
  </body>
